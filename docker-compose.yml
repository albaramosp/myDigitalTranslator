version: '3.9'

services:
  mydigitaltranslator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mydigitaltranslator
    environment:
      # LLM Configuration - Set these in your .env.example file or pass them explicitly
      # For Google GenAI:
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      
      # For Groq:
      # - GROQ_API_KEY=${GROQ_API_KEY}
      
      # Other environment variables
      PYTHONUNBUFFERED: "1"
    env_file:
      - .env.example
    volumes:
      # Mount source code for development
      - .:/app
      - ./magma_db:/app/magma_db
      - ./magma_docs:/app/magma_docs
      - huggingface_cache:/root/.cache/huggingface

      # Mount logs if needed
      - ./logs:/app/logs
    networks:
      - mydigitaltranslator-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: mdt_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped


networks:
  mydigitaltranslator-network:
    driver: bridge
    
volumes:
  ollama_models:
  huggingface_cache:
