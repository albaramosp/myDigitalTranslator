[project]
name = "mydigitaltranslator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.17.0",
    "groq>=1.6.0",
    "python-dotenv>=1.2.2",
    "trafilatura>=2.2.0",
    "pydantic>=2.13.4",
    "gradio>=6.24.0",
    "openai>=3.3.0",
    "litellm>=1.83.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
]

[tool.setuptools.packages.find]
include = [
    "domain*",
    "application*",
    "infrastructure*",
]
